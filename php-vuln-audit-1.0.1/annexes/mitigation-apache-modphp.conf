# PHP2Shell — mitigation TEMPORAIRE pour Apache + mod_php. Ne remplace pas la mise à jour.
# Où : /etc/apache2/conf-available/php2shell-mitigation.conf
# Puis : a2enconf php2shell-mitigation && apache2ctl configtest && systemctl restart apache2
# php_admin_* ne peut pas être réactivé par un .htaccess (contrairement à php_value/php_flag).
# Syntaxe validée avec Apache 2.4 + mod_php 8.3 (apache2ctl -t) le 2026-10-22.
<IfModule php_module>
    # CVE-2026-109619 — chemins « session upload progress » ; sans effet sur CVE-2026-109618.
    php_admin_flag session.upload_progress.enabled off

    # CVE-2026-109619 — PHP 8.5 UNIQUEMENT :
    # php_admin_value fatal_error_backtraces 0

    # CVE-2026-109618 — uniquement avec une limite mémoire cgroup (voir note, §E.3) :
    # php_admin_value memory_limit -1
    # php_admin_value post_max_size 32M
    # php_admin_value upload_max_filesize 16M
</IfModule>

# Limites HTTP (à adapter à la taille maximale d'upload réelle des applications) :
# LimitRequestBody 33554432
# LimitRequestFields 50
