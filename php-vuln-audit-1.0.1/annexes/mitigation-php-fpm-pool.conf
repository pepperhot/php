; PHP2Shell — mitigation TEMPORAIRE pour PHP-FPM. Ne remplace pas la mise à jour.
; Où : dans CHAQUE pool, sous l'en-tête [nom_du_pool] de /etc/php/X.Y/fpm/pool.d/*.conf
; Puis : php-fpmX.Y -t && systemctl restart phpX.Y-fpm   (restart, pas reload)
; Syntaxe validée avec php-fpm 8.3 (php-fpm8.3 -t) le 2026-10-22.

; CVE-2026-109619 — bloque les chemins « session upload progress » confirmés.
; Sans effet sur CVE-2026-109618. À conserver après correctif si la fonction est inutilisée.
php_admin_flag[session.upload_progress.enabled] = off

; CVE-2026-109619 — PHP 8.5 UNIQUEMENT. Ne pas activer sur 8.2/8.3/8.4.
;php_admin_value[fatal_error_backtraces] = 0

; CVE-2026-109618 — effet de bord : une requête peut consommer toute la RAM.
; N'activer qu'avec une limite mémoire systemd/cgroup (voir note, §E.3).
;php_admin_value[memory_limit] = -1

; CVE-2026-109618 — 8M sans upload, 32M avec upload ; upload_max_filesize < post_max_size.
;php_admin_value[post_max_size] = 32M
;php_admin_value[upload_max_filesize] = 16M

; CVE-2026-109619 — supprime la réutilisation des workers ; coût CPU important.
;pm.max_requests = 1
